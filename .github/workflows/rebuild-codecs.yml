name: Rebuild browser codecs

on:
  push:
    branches: [main]
    paths:
      - "tools/wasm/**"
      - ".github/workflows/rebuild-codecs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-browser-codecs
  cancel-in-progress: true

jobs:
  jpegtran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Fetch pinned libjpeg-turbo
        shell: bash
        run: |
          set -euo pipefail
          VERSION=3.2.0
          URL=https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${VERSION}/libjpeg-turbo-${VERSION}.tar.gz
          EXPECTED=6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e
          curl -L --fail --retry 3 -o /tmp/libjpeg-turbo.tar.gz "$URL"
          echo "$EXPECTED  /tmp/libjpeg-turbo.tar.gz" | sha256sum -c -
          rm -rf /tmp/libjpeg-turbo-src
          mkdir -p /tmp/libjpeg-turbo-src
          tar -xzf /tmp/libjpeg-turbo.tar.gz -C /tmp/libjpeg-turbo-src --strip-components=1

      - name: Build jpegtran as single-file ES module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/libjpeg-turbo-build
          mkdir -p /tmp/libjpeg-turbo-build
          cd /tmp/libjpeg-turbo-build
          emcmake cmake /tmp/libjpeg-turbo-src             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_EXECUTABLE_SUFFIX=.js             -DENABLE_SHARED=FALSE             -DENABLE_STATIC=TRUE             -DWITH_SIMD=FALSE             -DWITH_TOOLS=TRUE             -DWITH_TESTS=FALSE             -DCMAKE_EXE_LINKER_FLAGS="-O3 -sSINGLE_FILE=1 -sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=web,worker,node -sINVOKE_RUN=0 -sEXIT_RUNTIME=0 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -sEXPORTED_RUNTIME_METHODS=FS,callMain"
          sed -i 's/^#define SIZEOF_SIZE_T.*$/#define SIZEOF_SIZE_T 4/' jconfigint.h
          sed -i 's/^#define SIZEOF_UNSIGNED_LONG.*$/#define SIZEOF_UNSIGNED_LONG 4/' jconfigint.h
          grep -E 'SIZEOF_(SIZE_T|UNSIGNED_LONG)' jconfigint.h
          cmake --build . --target jpegtran-static cjpeg-static --parallel 2
          find . -maxdepth 2 -type f \( -name 'jpegtran*.js' -o -name 'cjpeg*.js' \) -print
          JPEGTRAN=$(find . -maxdepth 2 -type f -name 'jpegtran*.js' | head -n1)
          CJPEG=$(find . -maxdepth 2 -type f -name 'cjpeg*.js' | head -n1)
          test -n "$JPEGTRAN"
          test -n "$CJPEG"
          mkdir -p "$GITHUB_WORKSPACE/js/codecs/generated"
          cp "$JPEGTRAN" "$GITHUB_WORKSPACE/js/codecs/generated/jpegtran-module.js"
          cp "$CJPEG" "$GITHUB_WORKSPACE/js/codecs/generated/cjpeg-module.js"
          printf '\n// Generated from libjpeg-turbo 3.2.0 by .github/workflows/rebuild-codecs.yml\n' >> "$GITHUB_WORKSPACE/js/codecs/generated/jpegtran-module.js"
          printf '\n// Generated from libjpeg-turbo 3.2.0 by .github/workflows/rebuild-codecs.yml\n' >> "$GITHUB_WORKSPACE/js/codecs/generated/cjpeg-module.js"

          SPNG=/tmp/libjpeg-turbo-src/src/spng
          emcc "$GITHUB_WORKSPACE/tools/wasm/png_wrapper.c" \
            "$SPNG/spng.c" \
            "$SPNG/zlib/adler32.c" "$SPNG/zlib/compress.c" "$SPNG/zlib/crc32.c" \
            "$SPNG/zlib/deflate.c" "$SPNG/zlib/inffast.c" "$SPNG/zlib/inflate.c" \
            "$SPNG/zlib/inftrees.c" "$SPNG/zlib/trees.c" "$SPNG/zlib/zutil.c" \
            -I"$SPNG" -I"$SPNG/zlib" -DSPNG_STATIC -O3 \
            -sSINGLE_FILE=1 -sMODULARIZE=1 -sEXPORT_ES6=1 \
            -sENVIRONMENT=web,worker,node -sALLOW_MEMORY_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_malloc","_free","_jtrim_png_encode","_jtrim_png_output_ptr","_jtrim_png_output_size","_jtrim_png_free_output"]' \
            -sEXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
            -o "$GITHUB_WORKSPACE/js/codecs/generated/png-codec-module.js"
          printf '\n// Generated from bundled libspng 0.7.4 + zlib by .github/workflows/rebuild-codecs.yml\n' >> "$GITHUB_WORKSPACE/js/codecs/generated/png-codec-module.js"

      - name: Copy third-party notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/libjpeg-turbo third_party/libspng third_party/zlib
          cp /tmp/libjpeg-turbo-src/LICENSE.md third_party/libjpeg-turbo/LICENSE.md
          cp /tmp/libjpeg-turbo-src/README.ijg third_party/libjpeg-turbo/README.ijg
          cp /tmp/libjpeg-turbo-src/src/spng/LICENSE third_party/libspng/LICENSE
          cp /tmp/libjpeg-turbo-src/src/spng/zlib/LICENSE third_party/zlib/LICENSE

      - name: Smoke-test generated jpegtran module
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im = Image.new("RGB", (32, 16))
          for y in range(16):
              for x in range(32):
                  im.putpixel((x,y), ((x*7)%256, (y*13)%256, ((x+y)*5)%256))
          im.save("/tmp/input.jpg", quality=90, subsampling=0)
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import createJpegtran from './js/codecs/generated/jpegtran-module.js';
          const mod = await createJpegtran({ noInitialRun: true, print: () => {}, printErr: console.error });
          mod.FS.writeFile('/input.jpg', fs.readFileSync('/tmp/input.jpg'));
          mod.callMain(['-copy','all','-perfect','-rotate','90','-outfile','/output.jpg','/input.jpg']);
          const out = mod.FS.readFile('/output.jpg');
          if (out.length < 100) throw new Error('jpegtran output is unexpectedly small');
          fs.writeFileSync('/tmp/output.jpg', out);
          NODE
          python - <<'PY'
          from PIL import Image
          im = Image.open("/tmp/output.jpg")
          assert im.size == (16, 32), im.size
          im.verify()
          print("jpegtran WASM smoke test passed")
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import createCjpeg from './js/codecs/generated/cjpeg-module.js';
          const mod = await createCjpeg({ noInitialRun: true, print: () => {}, printErr: console.error });
          const width = 16, height = 8;
          const header = Buffer.from(`P6\n${width} ${height}\n255\n`);
          const pixels = Buffer.alloc(width * height * 3);
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const i = (y * width + x) * 3;
              pixels[i] = (x * 17) & 255;
              pixels[i + 1] = (y * 31) & 255;
              pixels[i + 2] = ((x + y) * 13) & 255;
            }
          }
          mod.FS.writeFile('/input.ppm', Buffer.concat([header, pixels]));
          mod.callMain(['-quality','90','-progressive','-outfile','/progressive.jpg','/input.ppm']);
          const out = mod.FS.readFile('/progressive.jpg');
          if (out.length < 100) throw new Error('cjpeg output is unexpectedly small');
          fs.writeFileSync('/tmp/progressive.jpg', out);
          NODE
          python - <<'PY'
          from PIL import Image
          im = Image.open("/tmp/progressive.jpg")
          assert im.size == (16, 8), im.size
          assert im.info.get("progressive") or im.info.get("progression"), im.info
          im.verify()
          print("cjpeg progressive WASM smoke test passed")
          PY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import createPngCodec from './js/codecs/generated/png-codec-module.js';
          const width = 9, height = 7;
          const rgba = new Uint8Array(width * height * 4);
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              const i = (y * width + x) * 4;
              rgba[i] = (x * 23) & 255;
              rgba[i + 1] = (y * 37) & 255;
              rgba[i + 2] = ((x + y) * 19) & 255;
              rgba[i + 3] = (x * 29 + y * 11) & 255;
            }
          }
          const mod = await createPngCodec();
          const ptr = mod._malloc(rgba.length);
          mod.HEAPU8.set(rgba, ptr);
          const rc = mod._jtrim_png_encode(ptr, rgba.length, width, height, 1, 6);
          mod._free(ptr);
          if (rc !== 0) throw new Error(`PNG codec failed with code ${rc}`);
          const outPtr = mod._jtrim_png_output_ptr();
          const outSize = mod._jtrim_png_output_size();
          const out = mod.HEAPU8.slice(outPtr, outPtr + outSize);
          mod._jtrim_png_free_output();
          if (out.length < 60) throw new Error('PNG output is unexpectedly small');
          fs.writeFileSync('/tmp/interlaced.png', out);
          NODE
          python - <<'PY'
          from PIL import Image
          raw = open("/tmp/interlaced.png", "rb").read()
          assert raw[:8] == b"\x89PNG\r\n\x1a\n"
          assert raw[28] == 1, f"IHDR interlace={raw[28]}"
          im = Image.open("/tmp/interlaced.png").convert("RGBA")
          assert im.size == (9, 7), im.size
          expected = []
          for y in range(7):
              for x in range(9):
                  expected.append(((x*23)&255, (y*37)&255, ((x+y)*19)&255, (x*29+y*11)&255))
          assert list(im.getdata()) == expected
          print("libspng Adam7 WASM smoke test passed")
          PY

      - name: Commit generated codec
        shell: bash
        run: |
          set -euo pipefail
          git add js/codecs/generated/jpegtran-module.js js/codecs/generated/cjpeg-module.js js/codecs/generated/png-codec-module.js third_party/libjpeg-turbo/LICENSE.md third_party/libjpeg-turbo/README.ijg third_party/libspng/LICENSE third_party/zlib/LICENSE
          if git diff --cached --quiet; then
            echo "Generated codec is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update browser codecs"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to push generated codecs after retries." >&2
          exit 1
