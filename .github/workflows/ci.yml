name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check worker module imports
        run: |
          node --input-type=module -e "globalThis.self={}; await import('./js/worker/image-worker.js')"
          node --input-type=module -e "globalThis.self={addEventListener(){},postMessage(){}}; await import('./js/worker/codec-worker.js')"
      - name: Check IO module imports
        run: node --input-type=module -e "await import('./js/io/files.js'); await import('./js/io/jpeg-exif.js'); await import('./js/io/jpeg-info.js'); await import('./js/io/print.js'); await import('./js/io/zip.js'); await import('./js/io/file-system-access.js'); await import('./js/io/handle-store.js'); await import('./js/workspace/workspace-controller.js'); await import('./js/preferences.js'); await import('./js/io/image-format.js'); await import('./js/io/save-format.js')"
      - name: Run IO smoke tests
        run: node tests/io-smoke.mjs
      - name: Run File System Access smoke tests
        run: node tests/file-system-access-smoke.mjs
      - name: Run HEIC format smoke tests
        run: node tests/heic-format-smoke.mjs
      - name: Run HEIF module resolver unit tests
        run: node tests/heic-module-resolver-smoke.mjs
      - name: Run HEIF decoder contract smoke tests
        run: node tests/heif-decoder-contract-smoke.mjs
      - name: Check HEIF Worker module import
        run: node --input-type=module -e "globalThis.self={addEventListener(){},postMessage(){}}; await import('./js/worker/heif-worker.js')"
      - name: Run HEIC input integration smoke tests
        run: node tests/heic-input-integration-smoke.mjs
      - name: Run HEIC overwrite protection tests
        run: node tests/heic-save-guard-smoke.mjs
      - name: Run JPEG / print smoke tests
        run: node tests/jpeg-print-smoke.mjs
      - name: Run shortcut smoke tests
        run: node tests/shortcuts-smoke.mjs
      - name: Run flood fill smoke tests
        run: node tests/flood-fill-smoke.mjs
      - name: Run advanced JPEG codec smoke tests
        run: node tests/advanced-codec-smoke.mjs
      - name: Check required entry files
        run: |
          test -f index.html
          test -f css/app.css
          test -f js/main.js
