name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check required entry files
        run: |
          test -f index.html
          test -f css/app.css
          test -f js/main.js
