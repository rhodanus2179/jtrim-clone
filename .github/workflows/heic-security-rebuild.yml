name: HEIC updated WASM private experiment

on:
  pull_request:
    paths:
      - ".github/workflows/heic-security-rebuild.yml"
      - "tools/heic/build-updated-wasm.sh"
      - "docs/heic-security-build-candidate.json"
      - "tests/heic-updated-wasm-e2e.mjs"
      - "tests/heic-highres-synthetic-e2e.mjs"
      - "tools/heic/generate-heic-highres-fixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updated-codec:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stage reviewed old package template (runner only)
        run: bash tools/heic/stage-review.sh "$RUNNER_TEMP/heic-secure-candidate"
      - name: Install Emscripten toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config cmake
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 3.1.61
          ./emsdk activate 3.1.61
          npm install --global --no-audit --no-fund typescript@5.4.5
      - name: Build updated CMake libde265 and libheif WASM
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          test "$(tsc --version)" = "Version 5.4.5"
          bash tools/heic/build-updated-wasm.sh "$RUNNER_TEMP/heic-secure-candidate"
          EXPECTED="$(node -p "require('./docs/heic-security-build-candidate.json').wasmSha256")"
                    printf '%s  %s\n' "$EXPECTED" "third_party/libheif-js/libheif-bundle.mjs" | sha256sum --check
      - name: Download public HEIC fixture, never private photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/heic-fixture"
          curl --retry 3 --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/strukturag/libheif/364905fc9841bdda229e0ae2c5fda13b5fc98d1a/examples/example.heic" \
            -o "$RUNNER_TEMP/heic-fixture/example.heic"
          test "$(stat -c%s "$RUNNER_TEMP/heic-fixture/example.heic")" = 718114
          echo "HEIC_TEST_FILE=$RUNNER_TEMP/heic-fixture/example.heic" >> "$GITHUB_ENV"
      - name: Install Playwright Chromium and Microsoft Edge
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/heic-playwright" --no-save --ignore-scripts --no-package-lock "playwright@1.56.1"
          "$RUNNER_TEMP/heic-playwright/node_modules/.bin/playwright" install --with-deps chromium msedge
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/heic-playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify rebuilt native source and decode real HEIC
        run: node tests/heic-updated-wasm-e2e.mjs
      - name: Chromium JTrim full HEIC UI E2E
        run: node tests/heic-browser-e2e.mjs
      - name: Microsoft Edge JTrim full HEIC UI E2E
        env:
          HEIC_BROWSER_CHANNEL: msedge
        run: node tests/heic-browser-e2e.mjs
      - name: Generate synthetic 24.47MP HEIC — no private image data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libheif-examples libx265-dev
          heif-enc --list-encoders
          heif-enc --list-encoders | grep -Eiq 'x265|HEIC encoders'
          python3 tools/heic/generate-heic-highres-fixture.py "$RUNNER_TEMP/heic-fixture/synthetic-highres.png"
          heif-enc -q 35 -o "$RUNNER_TEMP/heic-fixture/synthetic-highres.heic" \
            "$RUNNER_TEMP/heic-fixture/synthetic-highres.png"
          heif-info "$RUNNER_TEMP/heic-fixture/synthetic-highres.heic"
          test -s "$RUNNER_TEMP/heic-fixture/synthetic-highres.heic"
          echo "HEIC_HIGHRES_TEST_FILE=$RUNNER_TEMP/heic-fixture/synthetic-highres.heic" >> "$GITHUB_ENV"
      - name: Chromium synthetic 24.47MP double decode, editor load and RSS
        run: node tests/heic-highres-synthetic-e2e.mjs
      - name: Check release remains BLOCKED
        shell: bash
        run: |
          set -euo pipefail
          node tools/heic/release-gate.mjs --review-status
          if node tools/heic/release-gate.mjs --assert-release; then
            echo 'Unreviewed HEIC vendor must not be approved' >&2
            exit 1
          fi
      # No binary/photo/source archive artifact uploads.
